<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown for Wifeyy ❤️</title>
    <!-- Include canvas-confetti for a beautiful party explosion when it hits 0 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Romantic deep festive gradient background with sparkles vibe */
            background: linear-gradient(135deg, #1a0b2e 0%, #4c1c5c 50%, #962b73 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        /* Floating background decorative balloons */
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float Up 8s infinite ease-in-out;
            bottom: -100px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 550px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #ff758c, #ff7eb3, #fccb90);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.4rem;
            color: #ff9eba;
            font-weight: 400;
            margin-bottom: 25px;
        }
        .cake-emoji {
            font-size: 4.5rem;
            margin: 15px 0;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 25px 0;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.12);
            padding: 15px 10px;
            border-radius: 16px;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }
        .time-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.18);
        }
        .number {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(255,117,140,0.4);
            display: block;
        }
        .label {
            font-size: 0.75rem;
            color: #e0d0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
            display: block;
            font-weight: 500;
        }
        .target-text {
            font-size: 0.95rem;
            color: #d1b3e0;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }
        .heart {
            color: #ff477e;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Floating Background Elements -->
    <div class="balloon" style="left: 10%; animation-delay: 0s; background: rgba(255,117,140,0.2);"></div>
    <div class="balloon" style="left: 30%; animation-delay: 3s; background: rgba(255,203,144,0.2); width: 50px; height: 60px;"></div>
    <div class="balloon" style="left: 70%; animation-delay: 1.5s; background: rgba(224,208,240,0.2);"></div>
    <div class="balloon" style="left: 85%; animation-delay: 4.5s; background: rgba(255,126,179,0.2); width: 35px; height: 45px;"></div>

    <div class="container" id="countdown-card">
        <h1>Counting Every Second...</h1>
        <h2>Until Wifeyy's Birthday <span class="heart">❤️</span></h2>
        
        <div class="cake-emoji">🎂✨🎁</div>
        
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>
        
        <div class="target-text">✨ October 5, 2026 ✨</div>
    </div>

<script>
    // Hardcoded target date for Wifeyy's 2026 Birthday
    const birthdayTarget = new Date("Oct 5, 2026 00:00:00").getTime();

    function updateTimer() {
        const currentTime = new Date().getTime();
        const timeLeft = birthdayTarget - currentTime;

        // If target date is reached or passed
        if (timeLeft <= 0) {
            clearInterval(clockInterval);
            document.getElementById("countdown-card").innerHTML = `
                <h1 style="font-size: 2.8rem; background: linear-gradient(to right, #fff, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">👑 HAPPY BIRTHDAY WIFEYY! ❤️</h1>
                <div class="cake-emoji" style="font-size: 6rem; margin: 25px 0;">🎉🎁🍰🥳🎈</div>
                <h2 style="color: #fff; font-size: 1.5rem;">May all your beautiful dreams come true today! 🥰</h2>
            `;
            
            // Continuous romantic confetti shower
            setInterval(() => {
                confetti({
                    particleCount: 50,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff758c', '#ff7eb3', '#fccb90', '#ffffff']
                });
            }, 1000);
            return;
        }

        // Time calculation units
        const d = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const h = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((timeLeft % (1000 * 60)) / 1000);

        // Update elements on screen with 2-digit padding
        document.getElementById("days").innerText = String(d).padStart(2, '0');
        document.getElementById("hours").innerText = String(h).padStart(2, '0');
        document.getElementById("minutes").innerText = String(m).padStart(2, '0');
        document.getElementById("seconds").innerText = String(s).padStart(2, '0');
    }

    // Run clock immediately and refresh every single second
    updateTimer();
    const clockInterval = setInterval(updateTimer, 1000);
</script>

</body>
</html>
